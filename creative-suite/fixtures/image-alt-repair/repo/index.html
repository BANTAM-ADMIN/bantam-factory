<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moonroot — Rooftop After Dark</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero-art" src="assets/moonroot-campaign.png" alt="A gardener holds seedlings beside a glowing rooftop greenhouse above a blue city at night.">
      <div class="hero-copy">
        <p class="eyebrow">Moonroot rooftop garden</p>
        <h1 id="hero-title">A Rooftop After Dusk</h1>
        <p>Plants, small plates, and quiet hours above the city.</p>
        <a class="cta" href="#reserve">Reserve a Moonbed</a>
      </div>
      <div class="theme-toggle" role="group" aria-label="Color theme">
        <button type="button" data-theme-choice="night" aria-pressed="true">Night</button>
        <button type="button" data-theme-choice="dawn" aria-pressed="false">Dawn</button>
      </div>
    </section>
    <section id="reserve">
      <h2>Meet us on the roof.</h2>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
