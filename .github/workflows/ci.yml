name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    # The full harness suite drives the real dispatcher with scripted models —
    # no GPU needed. This is the merge gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # judgeFight reruns a Python corner's own suite with `python3 -m pytest`
      # (src/fight.js). The runner ships python3 but not pytest, which made the
      # anti-tampering judge test read as a judging bug rather than a missing
      # tool. Install it so the gate actually exercises that path.
      - run: python -m pip install --disable-pip-version-check pytest
      # acorn/acorn-walk are imported by src/agent.js's static import chain, so a
      # checkout without them fails 186 tests AND `bantam --help`. Verified on a
      # pristine clone, 2026-08-26.
      - run: npm ci
      # The shell sandbox pulls its base image on first use; do it here so a
      # registry hiccup is a named step rather than 9 mystery test failures.
      - run: docker pull alpine:3
      - run: node --test test/

  canary:
    # A live-model pulse check: one sealed task through the whole factory.
    # Needs a self-hosted runner with a model serving BANTAM_ENDPOINT —
    # trigger manually (workflow_dispatch) from a machine that has one.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: ./bin/bantam-canary.sh
        env:
          BANTAM_ENDPOINT: ${{ vars.BANTAM_ENDPOINT || 'http://127.0.0.1:8085' }}
