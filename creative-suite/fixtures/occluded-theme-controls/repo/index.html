<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Signal Garden</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hero">
    <header>
      <a class="brand" href="#campaign">signal garden</a>
      <div class="theme-switch" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="night" aria-pressed="true">Night</button>
        <button type="button" data-theme-choice="dawn" aria-pressed="false">Dawn</button>
      </div>
    </header>
    <section id="campaign" class="copy">
      <p class="eyebrow">After-dark field notes</p>
      <h1>Signal Garden</h1>
      <p>Follow a living frequency through the greenhouse after sunset.</p>
      <a class="cta" href="#details">Join the Night Walk</a>
    </section>
    <section id="details" class="details">
      <span>Friday · 8 PM</span><span>North Roof</span>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
